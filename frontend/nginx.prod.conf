# Serves the built frontend and passes /api to PHP-FPM (service "app").
# Always served at "/": a sub-path like /demo is stripped by the host's reverse proxy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    client_max_body_size 10m;

    # Trailing slash: page routes like /api-keys belong to the SPA, not the API
    location /api/ {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        # Behind the host proxy, which terminates TLS
        fastcgi_param HTTPS on;
    }

    # Hashed build assets never change
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: unknown paths are client-side routes
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
