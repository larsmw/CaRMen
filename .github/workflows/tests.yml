name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://crm:crm@127.0.0.1:5432/crm?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: changeme
      CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$'

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, sodium, ctype, iconv
          coverage: none

      - name: Create .env file
        working-directory: backend
        run: cp .env.test .env

      - name: Install dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate JWT keys
        working-directory: backend
        run: php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Create test database & run migrations
        working-directory: backend
        run: |
          php bin/console doctrine:database:create --if-not-exists
          php bin/console doctrine:migrations:migrate --no-interaction

      - name: Run PHPUnit
        working-directory: backend
        run: php bin/phpunit --testdox

  e2e:
    name: Playwright
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # dev, not test: the e2e specs log in as the AppFixtures users (admin@crm.local etc.)
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql://crm:crm@127.0.0.1:5432/crm?serverVersion=16&charset=utf8
      JWT_PASSPHRASE: changeme

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, sodium, ctype, iconv
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          cp .env.test .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php bin/console lexik:jwt:generate-keypair --skip-if-exists

      - name: Create database with fixtures
        working-directory: backend
        run: |
          php bin/console doctrine:migrations:migrate --no-interaction
          php bin/console doctrine:fixtures:load --no-interaction

      - name: Start backend
        working-directory: backend
        run: |
          php -S 127.0.0.1:8000 -t public/ > /tmp/backend.log 2>&1 &
          curl --retry 10 --retry-delay 1 --retry-connrefused -s -o /dev/null http://127.0.0.1:8000/api/install/status

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright starts Vite on :3001 itself (webServer in playwright.config.ts);
      # Vite proxies /api to the backend on :8000.
      - name: Run Playwright
        working-directory: frontend
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            /tmp/backend.log
          retention-days: 7
