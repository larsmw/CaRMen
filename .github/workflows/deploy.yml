name: Deploy

# - Every push to main that passes "Tests": build images, deploy the public demo.
# - "Run workflow" button: deploy (or roll back) crm or demo by hand.
# Images: ghcr.io/larsmw/carmen-{app,web,web-demo}:<commit sha>
# The server side is deploy/deploy.sh; see deploy/README.md.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      instance:
        description: Instance
        type: choice
        options: [crm, demo]
        default: crm
      action:
        description: Action
        type: choice
        options: [deploy, rollback]
        default: deploy
      sha:
        description: Commit to deploy (full SHA on main; empty = latest main)
        required: false

# One deploy at a time; a newer one waits instead of cancelling a running deploy
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      instance: ${{ steps.plan.outputs.instance }}
      action: ${{ steps.plan.outputs.action }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_SHA: ${{ inputs.sha }}
          IN_INSTANCE: ${{ inputs.instance }}
          IN_ACTION: ${{ inputs.action }}
        run: |
          if [ "$EVENT" = workflow_run ]; then
            sha=$RUN_SHA; instance=demo; action=deploy
          else
            sha=${IN_SHA:-$GITHUB_SHA}; instance=$IN_INSTANCE; action=$IN_ACTION
          fi
          [[ $sha =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$sha' is not a full commit SHA"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "instance=$instance" >> "$GITHUB_OUTPUT"
          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "### $action $instance @ ${sha:0:12}" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: carmen-app
            context: backend
            base: "/"
          - image: carmen-web
            context: frontend
            base: "/"
          - image: carmen-web-demo
            context: frontend
            base: "/demo/"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile.prod
          build-args: VITE_BASE=${{ matrix.base }}
          push: true
          tags: ghcr.io/larsmw/${{ matrix.image }}:${{ needs.plan.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [plan, build]
    # Rollbacks skip the build
    if: always() && needs.plan.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.plan.outputs.instance }}
      url: ${{ needs.plan.outputs.instance == 'crm' && 'https://crm.carmen-crm.net' || 'https://www.carmen-crm.net/demo/' }}
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ACTION: ${{ needs.plan.outputs.action }}
          INSTANCE: ${{ needs.plan.outputs.instance }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key's forced command on the server only accepts these two forms
          if [ "$ACTION" = deploy ]; then cmd="deploy $INSTANCE $SHA"; else cmd="rollback $INSTANCE"; fi
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@91.210.57.191 "$cmd"
