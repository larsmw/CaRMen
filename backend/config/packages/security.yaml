security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login
            stateless: true
            user_checker: App\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
            # Brute-force protection: 5 failed attempts per email+IP per 15 minutes (and
            # 25 per IP). A successful login resets the counters. Needs the real client IP,
            # see framework.trusted_proxies.
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'

        # Integrations (website forms etc.): API key only, no user logins
        leads:
            pattern: ^/api/leads
            stateless: true
            custom_authenticators:
                - App\Security\ApiKeyAuthenticator

        api:
            pattern: ^/api
            stateless: true
            user_checker: App\Security\UserChecker
            jwt: ~

    access_control:
        - { path: ^/api/login,           roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password,  roles: PUBLIC_ACCESS }
        - { path: ^/api/docs,            roles: PUBLIC_ACCESS }
        # Installer locks itself once a user exists (see InstallationController)
        - { path: ^/api/install,         roles: PUBLIC_ACCESS }
        - { path: ^/api/leads,           roles: ROLE_API_LEADS_CREATE }
        - { path: ^/api,                 roles: IS_AUTHENTICATED_FULLY }

    role_hierarchy:
        ROLE_SALES:   ROLE_USER
        ROLE_MANAGER: [ROLE_SALES]
        ROLE_ADMIN:   [ROLE_MANAGER]
