# crm.carmen-crm.net -> CaRMen instance "crm" on 127.0.0.1:8081
# Not managed by Puppet. Certificate: certbot certonly --nginx -d crm.carmen-crm.net
server {
    listen 80;
    listen [::]:80;
    server_name crm.carmen-crm.net;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crm.carmen-crm.net;

    ssl_certificate     /etc/letsencrypt/live/crm.carmen-crm.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.carmen-crm.net/privkey.pem;

    access_log /var/log/nginx/crm.carmen-crm.net.access.log;
    error_log  /var/log/nginx/crm.carmen-crm.net.error.log;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
