# Public demo at /demo/ on www.carmen-crm.net.
# Included from the www.carmen-crm.net server block (/etc/nginx/snippets/carmen-demo.location.conf).
location = /demo {
    return 301 /demo/;
}
location /demo/ {
    # Trailing slash strips the /demo prefix: the container serves the app at /
    proxy_pass http://127.0.0.1:8082/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /demo;
    proxy_read_timeout 60s;
}
